name: Release

on:
    # This workflow can be manually triggered
    workflow_dispatch:
    # But the main use case is to publish new images when a release is created
    release:
        types: [ published ]

permissions:
    contents: read  # This is required for actions/checkout

jobs:

    release:
        name: Publish PHP ${{ matrix.php_version }} images
        runs-on: ubuntu-24.04
        timeout-minutes: 60
        strategy:
            matrix:
                php_version: [ '83', '84', '85', '86' ]
        steps:
            -   uses: actions/checkout@v6

            -   name: Get the version
                id: get_version
                run: |
                  if [[ $GITHUB_REF == refs/tags/* ]]; then
                    VERSION=${GITHUB_REF#refs/tags/}
                  elif [[ $GITHUB_REF == refs/heads/* ]]; then
                    VERSION=${GITHUB_REF#refs/heads/}
                  else
                    VERSION=$GITHUB_REF
                  fi
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

            -   uses: depot/setup-action@v1

            -   name: Configure Docker Hub credentials
                uses: docker/login-action@v4
                with:
                    username: ${{ secrets.DOCKER_USERNAME }}
                    password: ${{ secrets.DOCKER_PASSWORD }}

            # Builds both architectures and pushes multi-architecture images
            -   run: make upload-to-docker-hub-php-${{ matrix.php_version }}
                env:
                    USE_DEPOT: 1
                    DEPOT_TOKEN: ${{ secrets.DEPOT_TOKEN }}
                    DOCKER_TAG: ${{ steps.get_version.outputs.VERSION }}
